spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/incidents}
    username: ${SPRING_DATASOURCE_USERNAME:incident}
    password: ${SPRING_DATASOURCE_PASSWORD:localdevonly}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
agent:
  url: ${AGENT_URL:http://localhost:8000}
management:
  endpoints:
    web:
      exposure:
        include: health,info