name: CI
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: cd backend && mvn test
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: cd agent && pip install -r requirements.txt && pytest -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: cd frontend && npm install && npm test && npm run build
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build and start stack
        run: docker compose up --build --detach --wait --wait-timeout 120
      - name: Exercise dashboard, API, agent, and PostgreSQL
        run: |
          set -euo pipefail
          curl -fsS http://localhost:3000/ | grep -q 'Incident Intelligence'
          curl -fsS --retry 30 --retry-all-errors --retry-delay 2 http://localhost:8080/actuator/health
          curl -fsS --retry 10 --retry-all-errors http://localhost:8000/health
          incident=$(curl -fsS http://localhost:3000/api/incidents \
            -H 'Content-Type: application/json' \
            -d '{"title":"Kafka consumer lag","serviceName":"kafka","severity":"HIGH"}')
          id=$(jq -er '.id' <<< "$incident")
          curl -fsS -X POST "http://localhost:3000/api/incidents/$id/investigate" \
            | jq -e '.runbooks | any(.title == "Kafka consumer lag")'
          curl -fsS "http://localhost:3000/api/incidents/$id/investigations" \
            | jq -e --argjson id "$id" 'any(.incidentId == $id)'
      - if: failure()
        run: docker compose ps -a && docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes
